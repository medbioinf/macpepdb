---
# tasks file for caddy

- name: Copy image
  when:
    - macpepdb_action == "start"
    - hostvars[inventory_hostname]['caddy_dockerimage_file'] is defined
    - hostvars[inventory_hostname]['caddy_dockerimage_file'] is not none
  ansible.builtin.copy:
    src: "{{ hostvars[inventory_hostname]['caddy_dockerimage_file'] }}"
    dest: "/tmp/macpepdb-caddy-image-ansible.tar"

- name: Load image
  when:
    - macpepdb_action == "start"
    - hostvars[inventory_hostname]['caddy_dockerimage_file'] is defined
    - hostvars[inventory_hostname]['caddy_dockerimage_file'] is not none
  community.docker.docker_image_load:
    path: "/tmp/macpepdb-caddy-image-ansible.tar"

- name: Delete image file
  when:
    - macpepdb_action == "start"
    - hostvars[inventory_hostname]['caddy_dockerimage_file'] is defined
    - hostvars[inventory_hostname]['caddy_dockerimage_file'] is not none
  community.docker.docker_image_load:
    path: "/tmp/macpepdb-caddy-image-ansible.tar"

- name: Create Caddy config directory
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '755'
  loop:
    - "{{ macpepdb_caddy_config_dir }}"
    - "{{ macpepdb_caddy_data_dir }}"
    - "{{ macpepdb_caddyfile_dir }}"

- name: Create Caddy configuration file
  ansible.builtin.include_tasks: create_config.yml

- name: Pull image
  when: macpepdb_action == "start"
  community.docker.docker_image_pull:
    name: caddy
    tag: 2
    pull: always

- name: Check if container exists
  community.docker.docker_container_info:
    name: macpepdb-caddy
  register: container_info
  ignore_errors: true

- name: Stopping existing container
  when: container_info.exists
  community.docker.docker_container:
    name: macpepdb-caddy
    state: absent
    stop_timeout: 60

- name: Set http port
  ansible.builtin.set_fact:
    ports_to_publish:
      - "80:80"

- name: Is any domain configured for SSL?
  ansible.builtin.set_fact:
    is_ssl_enabled: "{{ macpepdb_domains | rejectattr('ssl', 'none') | list | length > 0 }}"

- name: Set https port
  when: is_ssl_enabled
  ansible.builtin.set_fact:
    ports_to_publish: "{{ ports_to_publish + ['443:443'] }}"

- name: Start container
  when: macpepdb_action == "start"
  community.docker.docker_container:
    image: "{{ hostvars[inventory_hostname]['caddy_dockerimage'] | default('caddy:latest') }}"
    name: macpepdb-caddy
    # auto_remove: true
    restart_policy: unless-stopped
    published_ports: "{{ ports_to_publish }}"
    volumes:
      - "{{ macpepdb_caddyfile_dir }}:/etc/caddy:ro"
      - "{{ macpepdb_caddy_config_dir }}:/config"
      - "{{ macpepdb_caddy_data_dir }}:/data"

- name: Remove dangling images
  when: macpepdb_action == "start"
  community.docker.docker_prune:
    images: true
    images_filters:
      dangling: true
