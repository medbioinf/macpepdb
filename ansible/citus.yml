- name: Install setfacl
  hosts: citus_worker:citus_coordinator
  tasks:
    - name: Install setfacl
      ansible.builtin.apt:
        name:
          - acl
        update_cache: true
        state: present
      become: true

- name: Install citus
  hosts: citus_worker:citus_coordinator
  roles:
    - citus_common
  tags:
    - citus
    - citus_worker

- name: Setup citus coordinator
  hosts: citus_coordinator
  roles:
    - citus_coordinator
  tags:
    - citus
    - citus_coordinator
