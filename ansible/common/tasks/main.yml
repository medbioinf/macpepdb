---
# tasks file for common

- name: Update apt cache
  become: true
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Upgrade installed packages
  become: true
  ansible.builtin.apt:
    upgrade: dist

- name: Install base packages
  become: true
  ansible.builtin.apt:
    name:
      - zsh
      - git
      - vim
    state: present

- name: Download oh-my-zsh install script
  become: true
  become_user: "{{ ansible_user_id }}"
  ansible.builtin.get_url:
    url: https://raw.github.com/ohmyzsh/ohmyzsh/master/tools/install.sh
    dest: /tmp/omz_install.sh
    mode: '0755'

- name: Install oh-my-zsh
  become: true
  become_user: "{{ ansible_user_id }}"
  ansible.builtin.command:
    cmd: sh /tmp/omz_install.sh --unattended
    creates: "{{ ansible_user_dir }}/.oh-my-zsh"

- name: Install powerlevel10k theme
  become: true
  become_user: "{{ ansible_user_id }}"
  ansible.builtin.git:
    repo: https://github.com/romkatv/powerlevel10k.git
    dest: "{{ ansible_user_dir }}/.oh-my-zsh/custom/themes/powerlevel10k"
    depth: 1
    version: master
    single_branch: true

- name: Deploy .zshrc
  become: true
  become_user: "{{ ansible_user_id }}"
  ansible.builtin.copy:
    src: ./zshrc-basic
    dest: "{{ ansible_user_dir }}/.zshrc"
    mode: '0644'

- name: Deploy powerlevel10k config
  become: true
  become_user: "{{ ansible_user_id }}"
  ansible.builtin.copy:
    src: ./p10kzsh-basic
    dest: "{{ ansible_user_dir }}/.p10k.zsh"
    mode: '0644'

- name: Set zsh as default shell
  become: true
  ansible.builtin.user:
    name: "{{ ansible_user_id }}"
    shell: /usr/bin/zsh
