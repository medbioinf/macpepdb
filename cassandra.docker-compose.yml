networks:
  cassandra-net:
    driver: bridge

services:

  cassandra-1:
    image: "cassandra:latest"  # cassandra:4.1.3
    container_name: "cassandra1"
    hostname: cassandra1
    ports:
      - 7000:7000
      - 9042:9042
    networks:
      - cassandra-net
    environment: &environment
      CASSANDRA_CLUSTER_NAME: macpepdb-cluster
      CASSANDRA_DC: macpepdb-dc
      CASSANDRA_rack: macpepdb-rack
      CASSANDRA_START_RPC: true
      CASSANDRA_RPC_ADDRESS: 0.0.0.0
      CASSANDRA_LISTEN_ADDRESS: auto
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      CASSANDRA_NUM_TOKENS: 4
      CASSANDRA_SEEDS: cassandra1
    volumes:
      - cassandra-node-1:/var/lib/cassandra:rw
    healthcheck: &healthcheck
      test: ["CMD-SHELL", "nodetool status"]
      interval: 2m
      start_period: 2m
      timeout: 10s
      retries: 5

  cassandra-2:
    image: "cassandra:latest"  # cassandra:4.1.3
    container_name: "cassandra2"
    hostname: cassandra2
    ports:
      - 9043:9042
    networks:
      - cassandra-net
    environment: *environment
    depends_on:
      cassandra-1:
        condition: service_healthy
    volumes:
      - cassandra-node-2:/var/lib/cassandra:rw
    healthcheck: *healthcheck

volumes:
  cassandra-node-1:
  cassandra-node-2:
