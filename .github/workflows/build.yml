name: Rust

on:
  push:
    tags:
      # macpepdb (binaries + backend image)
      - '[0-9]+.[0-9]+.[0-9]+'
      # macpepdb-frontend (frontend image + tarball), released independently
      - 'frontend-[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  lint:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    needs: lint
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Start containers
        run: |
          docker compose down -v --remove-orphans
          docker compose up -d

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true

      - name: Wait for Citus coordinator to become available
        run: |
          for i in $(seq 1 60); do
            if out=$(docker exec citus-master pg_isready -U postgres 2>&1); then
              echo "Citus coordinator is up"
              exit 0
            fi
            echo "Citus coordinator is not ready - sleeping ($out)"
            sleep 2
          done
          echo "Citus coordinator did not become ready in time" >&2
          echo "--- docker compose ps" >&2
          docker compose ps -a >&2 || true
          echo "--- logs" >&2
          docker compose logs --tail=100 master manager >&2 || true
          echo "--- listeners on 5432" >&2
          (ss -ltnp 2>/dev/null || netstat -ltn 2>/dev/null) | grep 5432 >&2 || true
          exit 1

      - name: Test
        id: test
        uses: actions-rs/cargo@v1
        with:
          command: test
          args: --release --verbose --workspace

      - name: Live DB peptide search tests
        id: test-live-db
        uses: actions-rs/cargo@v1
        with:
          command: test
          args: --release --verbose -p macpepdb --test live_db_peptide_search -- --ignored --nocapture

      - name: Stop containers
        if: always()
        run: docker compose down --remove-orphans

  publish-dry-run:
    needs: lint
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true

      - name: Dry-run crates.io publish
        run: cargo publish --workspace --dry-run

  binaries:
    name: binary (${{ matrix.target }})
    needs: test
    if: startsWith(github.ref, 'refs/tags/') && !startsWith(github.ref_name, 'frontend-')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            ext: ""
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            ext: ""
          - target: aarch64-apple-darwin
            os: macos-14
            ext: ""
          - target: x86_64-apple-darwin
            os: macos-14
            ext: ""
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: ".exe"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --package macpepdb --target ${{ matrix.target }}

      - name: Rename binary
        shell: bash
        run: cp "target/${{ matrix.target }}/release/macpepdb${{ matrix.ext }}" "macpepdb-${{ matrix.target }}${{ matrix.ext }}"

      - uses: actions/upload-artifact@v4
        with:
          name: macpepdb-${{ matrix.target }}
          path: macpepdb-${{ matrix.target }}${{ matrix.ext }}
          if-no-files-found: error

  frontend:
    needs: docker-publish-frontend
    runs-on: ubuntu-24.04
    if: startsWith(github.ref_name, 'frontend-')
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract frontend from the published image
        run: |
          version="${VERSION#frontend-}"
          image="${{ env.REGISTRY }}/medbioinf/macpepdb-frontend:${version}"
          name="macpepdb-frontend-${version}"
          container=$(docker create "$image")
          docker cp "$container:/usr/share/caddy/." "$name"
          docker rm "$container"
          tar czf "$name.tar.gz" "$name"

      - uses: actions/upload-artifact@v4
        with:
          name: macpepdb-frontend
          path: macpepdb-frontend-*.tar.gz
          if-no-files-found: error

  github-release-backend:
    needs: binaries
    if: startsWith(github.ref, 'refs/tags/') && !startsWith(github.ref_name, 'frontend-')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          # skip docker build-record artifacts (names contain `~`, download fails)
          pattern: macpepdb-*
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # previous backend tag, so generated notes do not mix in frontend-* tags
          prev=$(git tag --list '[0-9]*' --sort=-v:refname | grep -vx "${{ github.ref_name }}" | head -n1 || true)
          args=()
          [ -n "$prev" ] && args+=(--notes-start-tag "$prev")
          gh release create "${{ github.ref_name }}" dist/* \
            --generate-notes "${args[@]}" \
            --notes "> **Note:** \`macpepdb\` and \`macpepdb-frontend\` are released independently but are meant to be used together. Use the same major.minor version of both (patch versions may differ). Frontend releases are tagged \`frontend-X.Y.Z\`: https://github.com/${{ github.repository }}/releases"

  github-release-frontend:
    needs: frontend
    if: startsWith(github.ref_name, 'frontend-')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: macpepdb-*
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${{ github.ref_name }}"
          version="${version#frontend-}"
          prev=$(git tag --list 'frontend-*' --sort=-v:refname | grep -vx "${{ github.ref_name }}" | head -n1 || true)
          args=()
          [ -n "$prev" ] && args+=(--notes-start-tag "$prev")
          gh release create "${{ github.ref_name }}" dist/* \
            --title "Frontend ${version}" \
            --generate-notes "${args[@]}" \
            --notes "> **Note:** \`macpepdb-frontend\` and \`macpepdb\` are released independently but are meant to be used together. Use the same major.minor version of both (patch versions may differ). Backend releases are tagged \`X.Y.Z\`: https://github.com/${{ github.repository }}/releases"

  docker-publish-backend:
    needs: test
    if: startsWith(github.ref, 'refs/tags/') && !startsWith(github.ref_name, 'frontend-')
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/macpepdb/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/medbioinf/macpepdb:${{ github.ref_name }}
            ${{ env.REGISTRY }}/medbioinf/macpepdb:latest

  docker-publish-frontend:
    needs: test
    if: startsWith(github.ref_name, 'frontend-')
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Strip tag prefix
        id: version
        run: echo "version=${GITHUB_REF_NAME#frontend-}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/medbioinf/macpepdb-frontend:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/medbioinf/macpepdb-frontend:latest
