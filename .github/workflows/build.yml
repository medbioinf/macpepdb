name: Rust

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  lint:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-features --all-targets -- -D warnings

  test:
    needs: lint
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Start containers
        run: docker compose up -d

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true

      - name: Wait for Citus coordinator to become available
        run: |
          for i in $(seq 1 60); do
            if PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d postgres -c 'select 1' > /dev/null 2>&1; then
              echo "Citus coordinator is up"
              exit 0
            fi
            echo "Citus coordinator is not ready - sleeping"
            sleep 2
          done
          echo "Citus coordinator did not become ready in time" >&2
          exit 1

      - name: Test
        id: test
        uses: actions-rs/cargo@v1
        with:
          command: test
          args: --release --verbose --all-features --workspace

      - name: Stop containers
        if: always()
        run: docker compose down --remove-orphans

  docker-publish:
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: self-hosted
    strategy:
      matrix:
        include:
          - image: macpepdb
            dockerfile: docker/macpepdb/Dockerfile
          - image: macpepdb-frontend
            dockerfile: docker/frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/medbioinf/${{ matrix.image }}:${{ github.ref_name }}
            ${{ env.REGISTRY }}/medbioinf/${{ matrix.image }}:latest

  crates-publish:
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true

      - name: Publish leaf crates
        env:
          CRATESIO_TOKEN: ${{ secrets.CRATESIO_TOKEN }}
        run: |
          for crate in uniprot_reader peptide_hydrophobicity macpepdb_web_common metrics-peek macpepdb_tui; do
            cargo publish -p "$crate" --token "$CRATESIO_TOKEN" || true
          done

      - name: Wait for crates.io index to catch up
        run: sleep 30

      - name: Publish macpepdb
        env:
          CRATESIO_TOKEN: ${{ secrets.CRATESIO_TOKEN }}
        run: cargo publish -p macpepdb --token "$CRATESIO_TOKEN"
