name: Rust

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  lint:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    needs: lint
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Start containers
        run: |
          docker compose down -v --remove-orphans
          docker compose up -d

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true

      - name: Wait for Citus coordinator to become available
        run: |
          for i in $(seq 1 60); do
            if out=$(docker exec citus-master pg_isready -U postgres 2>&1); then
              echo "Citus coordinator is up"
              exit 0
            fi
            echo "Citus coordinator is not ready - sleeping ($out)"
            sleep 2
          done
          echo "Citus coordinator did not become ready in time" >&2
          echo "--- docker compose ps" >&2
          docker compose ps -a >&2 || true
          echo "--- logs" >&2
          docker compose logs --tail=100 master manager >&2 || true
          echo "--- listeners on 5432" >&2
          (ss -ltnp 2>/dev/null || netstat -ltn 2>/dev/null) | grep 5432 >&2 || true
          exit 1

      - name: Test
        id: test
        uses: actions-rs/cargo@v1
        with:
          command: test
          args: --release --verbose --workspace

      - name: Live DB peptide search tests
        id: test-live-db
        uses: actions-rs/cargo@v1
        with:
          command: test
          args: --release --verbose -p macpepdb --test live_db_peptide_search -- --ignored --nocapture

      - name: Stop containers
        if: always()
        run: docker compose down --remove-orphans

  publish-dry-run:
    needs: lint
    if: github.event_name == 'pull_request'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true

      - name: Dry-run crates.io publish
        run: cargo publish --workspace --dry-run

  binaries:
    name: binary (${{ matrix.target }})
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            ext: ""
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            ext: ""
          - target: aarch64-apple-darwin
            os: macos-14
            ext: ""
          - target: x86_64-apple-darwin
            os: macos-14
            ext: ""
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: ".exe"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --package macpepdb --target ${{ matrix.target }}

      - name: Rename binary
        shell: bash
        run: cp "target/${{ matrix.target }}/release/macpepdb${{ matrix.ext }}" "macpepdb-${{ matrix.target }}${{ matrix.ext }}"

      - uses: actions/upload-artifact@v4
        with:
          name: macpepdb-${{ matrix.target }}
          path: macpepdb-${{ matrix.target }}${{ matrix.ext }}
          if-no-files-found: error

  frontend:
    needs: docker-publish
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract frontend from the published image
        run: |
          image="${{ env.REGISTRY }}/medbioinf/macpepdb-frontend:${{ github.ref_name }}"
          name="macpepdb-frontend-${{ github.ref_name }}"
          container=$(docker create "$image")
          docker cp "$container:/usr/share/caddy/." "$name"
          docker rm "$container"
          tar czf "$name.tar.gz" "$name"

      - uses: actions/upload-artifact@v4
        with:
          name: macpepdb-frontend
          path: macpepdb-frontend-${{ github.ref_name }}.tar.gz
          if-no-files-found: error

  github-release:
    needs: [binaries, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "${{ github.ref_name }}" dist/* --generate-notes

  docker-publish:
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: self-hosted
    strategy:
      matrix:
        include:
          - image: macpepdb
            dockerfile: docker/macpepdb/Dockerfile
          - image: macpepdb-frontend
            dockerfile: docker/frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/medbioinf/${{ matrix.image }}:${{ github.ref_name }}
            ${{ env.REGISTRY }}/medbioinf/${{ matrix.image }}:latest
