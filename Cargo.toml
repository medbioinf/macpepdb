[workspace]
resolver = "3"
members = [
    "packages/macpepdb",
    "packages/metrics-peek",
    "packages/uniprot_reader",
    "packages/tui",
]

[workspace.dependencies]
axum = "0.8.9"
chrono = "0.4"
clap = "~4.6.0"
crossbeam = "~0.8.4"
crossterm = "0.28"
dashmap = "6.1"
deku = "~0.20.0"
dihardts_omicstools = "~3.1.0"
fallible-iterator = "~0.3.0"
fancy-regex = "~0.17.0"
futures = "~0.3.32"
itertools = "~0.14.0"
metrics = "0.24"
metrics-exporter-prometheus = {version = "0.18.1", default-features = false}
metrics-util = "0.20"
mimalloc = "0.1.50"
num-traits = "~0.2.19"
parking_lot = "0.12"
pastey = "~0.2.1"
postcard = "~1.1.3"
ratatui = "0.29"
serde = "~1.0.228"
serde_json = "~1.0.149"
scylla = "~1.6.0"
thiserror = "~2.0.18"
tikv-jemallocator = "0.6"
tokio = "1.51"
tower-http = "0.6.8"
tracing = "0.1"
tracing-appender = "0.2"
tracing-loki = "0.2"
tracing-subscriber = "0.3"
url = "2.5"

# workspace
macpepdb = { path = "packages/macpepdb" }
metrics-peek = { path = "packages/metrics-peek" }
macpepdb_tui = { path = "packages/tui" }
uniprot_reader = { path = "packages/uniprot_reader" }
