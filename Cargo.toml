[package]
name = "macpepdb-frontend"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.75"
async-std = "1.13.2"
base64 = "0.22.1"
chrono = "0.4.39"
dioxus = { version = "0.7.1", features = ["router", "logger"] }
dioxus-logger = "0.6.2"
futures-util = "0.3.31"
log = "0.4.20"
plotly = { version = "0.12.1", features = ["wasm"] }
reqwest = { version = "0.12.24", features = ["json", "http2"] }
serde = { version = "1.0.193", features = ["rc"] }
serde_json = "1.0.138"
thiserror = "2.0.17"
toml = "0.8.8"
urlencoding = "2.1.3"
uuid = { version = "1.18.1", features = ["js", "v4"] }
web-sys = { version = "0.3.77", features = ["Clipboard", "Navigator"] }
xxhash-rust = { version = "0.8.15", features = ["xxh3"] }

[dev-dependencies]
toml = "0.8.8"

[features]
default = ["web"]
web = ["dioxus/web"]

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"


