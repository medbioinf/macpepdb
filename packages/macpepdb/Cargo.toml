[package]
name = "macpepdb"
version = "0.1.0"
edition = "2024"
description = "Mass-indexed peptide database: digests UniProt protein files with a protease and answers mass-based peptide searches over a CLI and HTTP API"
license = "BSD-3-Clause"
repository = "https://github.com/medbioinf/macpepdb"
keywords = ["proteomics", "peptides", "macpepdb"]

[dependencies]
async-compression = { workspace = true, features = ["gzip", "tokio"] }
async-stream = { workspace = true }
axum = { workspace = true, features = ["json", "http2", "matched-path"] }
base64 = { workspace = true }
bytes = { workspace = true }
clap = { workspace = true, features = ["derive"] }
console-subscriber = { workspace = true, optional = true, features = ["env-filter", "grpc-web"] }
crossbeam = { workspace = true }
csv = { workspace = true }
dashmap = { workspace = true }
dihardts_omicstools = { workspace = true }
fallible-iterator = { workspace = true }
futures = { workspace = true }
glob = { workspace = true }
http = { workspace = true }
hyper = { workspace = true, features = ["server", "http1", "http2"] }
hyper-util = { workspace = true, features = ["tokio", "server", "server-auto", "service"] }
itertools = { workspace = true }
macpepdb_tui = { workspace = true }
macpepdb_web_common = { workspace = true }
memchr = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
macpepdb_metrics_peek = { workspace = true }
metrics-util = { workspace = true }
mimalloc = { workspace = true, optional = true }
num-traits = { workspace = true }
pastey = { workspace = true }
macpepdb_peptide_hydrophobicity = { workspace = true }
postcard = { workspace = true, features = ["alloc"] }
rand = { workspace = true }
reqwest = { workspace = true, features = ["stream", "json", "http2"] }
serde = { workspace = true, features = ["derive", "rc"] }
serde_json = { workspace = true }
tokio-postgres = { workspace = true, features = ["array-impls"] }
deadpool-postgres = { workspace = true }
postgres-types = { workspace = true }
static_assertions = { workspace = true }
sysinfo = { workspace = true }
tcmalloc2 = { workspace = true, optional = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tinyvec = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tower = { workspace = true }
tower-http = { workspace = true, features = ["cors"] }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-loki = { workspace = true }
tracing-subscriber = { workspace = true }
macpepdb_uniprot_reader = { workspace = true, features = ["async", "serde"] }
url = { workspace = true }
urlencoding = { workspace = true }
uuid = { workspace = true, features = ["v1", "v7"] }
zerocopy = { workspace = true, features = ["derive"] }
zstd = { workspace = true }
xxhash-rust = { workspace = true, features = ["xxh3"] }
rayon = "1.12.0"

[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = { workspace = true, optional = true }

[build-dependencies]
dihardts_omicstools = { workspace = true }


[features]
default = ["mimalloc"]
# Exposes a runtime DB-client-rebuild endpoint (`/api/admin/client`). Lets a caller repoint the
# server at an arbitrary PostgreSQL URL — never enable on an internet-facing build.
admin-api = []
jemalloc = ["dep:tikv-jemallocator"]
mimalloc = ["dep:mimalloc"]
tcmalloc = ["dep:tcmalloc2"]
tokio-console = ["dep:console-subscriber", "tokio/tracing"]
