[package]
name = "macpepdb_uniprot_reader"
version = "0.1.0"
edition.workspace = true
description = "Streaming/async parser for UniProt text dumps (.txt, .txt.gz)"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["proteomics", "peptides", "uniprot", "macpepdb"]

[dependencies]
futures = { workspace = true, optional = true }
serde = { workspace = true, optional = true, features = ["derive"] }
tokio = { workspace = true , optional = true}
thiserror = { workspace = true }

[dev-dependencies]
async-compression = { workspace = true, features = ["gzip", "tokio"] }
flate2 = { workspace = true }

[features]
default = ["async"]
async = ["dep:futures", "dep:tokio", "tokio/io-util", "tokio/fs", "tokio/macros", "tokio/rt"]
serde = ["dep:serde"]
